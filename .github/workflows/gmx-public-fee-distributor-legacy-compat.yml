name: GMX historical FeeDistributor compatible baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gmx-public-fee-distributor-legacy-compat.yml

permissions:
  contents: read

jobs:
  legacy-public-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      HARDHAT_NETWORK: hardhat
      HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout historical public FeeDistributor source
        uses: actions/checkout@v4
        with:
          repository: gmx-io/gmx-synthetics
          ref: 7fde9c58a110ff2a99efd528af95006f7448cb8c
          path: gmx
          persist-credentials: false
      - name: Node20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Yarn classic
        run: npm install -g yarn@1.22.22
      - name: Install historical public deps with compatibility resolution
        working-directory: gmx
        run: |
          echo "Original frozen-lockfile install failed because 2025 package.json and yarn.lock are inconsistent."
          echo "This compatibility build is NOT lockfile-reproducible; changed packages must not be treated as a canonical security baseline."
          yarn install --ignore-scripts --non-interactive
      - name: Compile original public contracts locally
        working-directory: gmx
        run: yarn hardhat compile
      - name: Run original public FeeDistributor test on isolated Hardhat
        working-directory: gmx
        run: yarn hardhat test --no-compile test/fee/FeeDistributor.ts
